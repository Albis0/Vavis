[workspace]
resolver = "2"
members = [
    "crates/vavis-core",
    "crates/vavis-brain",
    "crates/vavis-audio",
    "crates/vavis-tools",
    "crates/vavis-shell",
]

# Bağımlılıklar burada tek yerde sabitlenir; crate'ler `workspace = true` ile alır.
# Böylece sürüm çakışması olmaz ve derleme süresi düşer.
[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
futures-util = "0.3"

# Release profile: one file, small binary, but not so stripped that it looks
# like malware.
#
# `strip = "symbols"` and `panic = "abort"` shave about a megabyte off, and
# together they leave a binary with no symbol table and no unwind tables --
# exactly the shape of a packed executable. Defender's ML model flagged 0.4.0
# as Trojan:Win32/Sabsik.FL.A!ml on that basis alone, with no signature match.
# Keeping the symbol table and the unwind tables makes it look like the
# ordinary Rust program it is; `debuginfo` still drops the large DWARF
# sections, so the binary stays small.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
