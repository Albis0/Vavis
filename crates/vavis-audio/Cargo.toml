[package]
name = "vavis-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VAVIS duyular katmani — STT, TTS, VAD, barge-in"

[dependencies]
vavis-core = { path = "../vavis-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# `blocking` is enabled here and nowhere else. TTS synthesis is called from a
# dedicated speech thread that is already blocking on playback, so a blocking
# client is the honest shape -- and the alternative, bridging to an async
# runtime, would mean depending on a crate this layer sits below.
reqwest = { workspace = true, features = ["blocking"] }
tracing.workspace = true
cpal = "0.15"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
sha2 = "0.11.0"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
